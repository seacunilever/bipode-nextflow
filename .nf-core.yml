repository_type: pipeline

nf_core_version: 3.2.0

lint:
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  files_unchanged:
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
  multiqc_config: false
  files_exist:
    - .github/workflows/awstest.yml
    - .github/workflows/branch.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-bifrost_logo_light.png
    - docs/images/nf-core-bifrost_logo_light.png
    - docs/images/nf-core-bifrost_logo_dark.png
  included_configs: false

template:
  org: seqera-services
  name: bifrost
  description: Bifrost pipeline
  author: Joe Reynolds, Mark Liddell, Jonathan Manning
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - nf_core_configs
    - multiqc
    - fastqc
    - email
    - adaptivecard
    - slackreport
  is_nfcore: false
